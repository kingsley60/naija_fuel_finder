{% extends "stations/base.html" %}
{% load static %}

{% block content %}
<!-- Offline Status Banner -->
<div id="offline-banner" style="display:none; background:#dc2626; color:white; text-align:center; padding:10px; font-weight:bold; font-size: 0.9rem;">
    ⚠️ You are offline. Showing cached data.
</div>
<!-- Filter Bar -->
<div class="filter-bar">
    <label for="fuelFilter">Fuel</label>
    <select id="fuelFilter" aria-label="Filter by fuel type">
        <option value="">All Fuel Types</option>
        <option value="PMS">Petrol (PMS)</option>
        <option value="AGO">Diesel (AGO)</option>
        <option value="LPG">Cooking Gas (LPG)</option>
    </select>
    <label for="brandFilter">Brand</label>
    <select id="brandFilter" aria-label="Filter by station brand">
        <option value="">All Brands</option>
        <option value="NNPC">NNPC</option>
        <option value="TOTAL">Total</option>
        <option value="OANDO">Oando</option>
        <option value="INDEPENDENT">Independent</option>
    </select>
    <label for="radiusFilter">Search</label>
    <select id="radiusFilter" aria-label="Search radius">
        <option value="nearest" selected>Closest 10 in Nigeria</option>
        <option value="5">5 km</option>
        <option value="10">10 km</option>
        <option value="25">25 km</option>
        <option value="50">50 km</option>
        <option value="100">100 km</option>
    </select>
    <button id="locateBtn" class="btn-primary" type="button">📍 Find Near Me</button>
</div>
<p id="statusMessage" class="status-message" role="status" aria-live="polite">
    Showing stations near Abuja. Choose “Find Near Me” to search around your location.
</p>

<!-- Map Container -->
<div id="map" role="region" aria-label="Map of nearby fuel stations"></div>

<!-- Station List Container -->
<div id="stationList" class="station-list" aria-live="polite"></div>

<!-- Report Price Modal (Hidden by default) -->
<div id="reportModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
        <h3 id="modalTitle">Report Price</h3>
        <form id="reportForm">
            <input type="hidden" id="reportStationId">
            
            <label for="reportFuel">Fuel Type</label>
            <select id="reportFuel" required>
                <option value="PMS">Petrol (PMS)</option>
                <option value="AGO">Diesel (AGO)</option>
                <option value="LPG">Cooking Gas (LPG)</option>
            </select>
            
            <label for="reportPrice">Price per Litre (₦)</label>
            <input type="number" id="reportPrice" min="200" max="2000" step="0.01" required>
            
            <label for="reportQueue">Queue Status</label>
            <select id="reportQueue">
                <option value="NONE">No Queue</option>
                <option value="SHORT">Short (< 30 mins)</option>
                <option value="LONG">Long (30 mins - 2 hrs)</option>
                <option value="VERY_LONG">Very Long (> 2 hrs)</option>
            </select>
            
            <label class="checkbox-label">
                <input type="checkbox" id="reportAvailable" checked> Fuel is Available
            </label>
            
            <button type="submit" class="btn-primary">Submit Report</button>
            <button type="button" id="closeReportModal" class="btn-secondary">Cancel</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/app.js' %}"></script>
{% endblock %}
