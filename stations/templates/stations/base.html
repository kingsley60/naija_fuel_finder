{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaijaFuelFinder</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
    <!-- Leaflet CSS for the map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Our custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <h1>⛽ NaijaFuelFinder</h1>
        <div>
            {% if user.is_authenticated %}
                <span class="nav-greeting">Hello, {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="POST" class="nav-form">
                    {% csrf_token %}
                    <button type="submit" class="nav-button">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="nav-link">Login</a>
                <a href="{% url 'register' %}" class="nav-link nav-link-highlight">Register</a>
            {% endif %}
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <!-- Leaflet JS for the map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Our custom JS -->
    {% block scripts %}{% endblock %}
    <!-- Register Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register("/sw.js", { scope: '/' })
            .then(registration => {
            console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
            });
        });
    }
    </script>
</body>
</html>
